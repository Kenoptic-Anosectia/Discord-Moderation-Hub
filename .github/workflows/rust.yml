name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Install pinned Rust toolchain and rustfmt
      run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Build locked dependencies
      run: cargo build --locked --verbose
    - name: Run offline helper tests with locked dependencies
      run: cargo test --locked --offline --verbose
