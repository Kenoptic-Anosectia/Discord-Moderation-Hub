[package]
name = "skynet-network-core"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your@email.com>"]
description = "SKYNET // NETWORK CORE is a custom Discord bot built specifically for a private server, handling moderation, logging, reaction roles, and server-specific workflows."
license = "MIT"
repository = "https://github.com/Kenoptic-Anosectia/skynet-network-core"
homepage = "https://github.com/Kenoptic-Anosectia/skynet-network-core"
documentation = "https://github.com/Kenoptic-Anosectia/skynet-network-core"
readme = "README.md"
keywords = ["discord", "bot", "serenity", "poise", "moderation"]
categories = ["command-line-utilities", "web-programming"]
publish = false

[dependencies]
poise = "0.6.1"
serenity = "0.12.4"

tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio-rusqlite = "0.6.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false